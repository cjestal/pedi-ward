<!doctype html>
<meta charset="utf-8">
<title>ward tests</title>
<pre id="out">running…</pre>
<script type="module">
import * as C from './calc.js';
import { TOOLS } from './tools.js';

const F = C.FORMULAS, S = C.SCORES;
const results = [];
function t(name, fn) { try { fn(); results.push(`PASS ${name}`); } catch (e) { results.push(`FAIL ${name}: ${e.message}`); } }
function eq(a, b, what, tol = 1e-6) { if (!(typeof b === 'number' ? Math.abs(a - b) <= tol : a === b)) throw new Error(`${what}: got ${a}, want ${b}`); }

// --- data integrity ---
t('every entry has name, source page and text, flags, verified', () => {
  for (const [id, e] of [...Object.entries(F), ...Object.entries(S)]) {
    if (!e.name || !(e.source?.page > 0) || !e.source.text || !Array.isArray(e.flags) || typeof e.verified !== 'boolean') throw new Error(id);
  }
});
t('every tool has data, a group and a unique id', () => {
  const ids = new Set();
  for (const tl of TOOLS) { if (!tl.data || !tl.group || ids.has(tl.id)) throw new Error(tl.id); ids.add(tl.id); }
});
t('sum scores: bands cover 0 and are sorted high to low', () => {
  for (const s of Object.values(S).filter((x) => x.kind === 'sum')) {
    for (let i = 1; i < s.bands.length; i++) if (!(s.bands[i].min < s.bands[i - 1].min)) throw new Error(s.name);
    const min = s.items.reduce((m, it) => m + Math.min(...it.options.map((o) => o.points)), 0);
    if (s.bands.at(-1).min > min) throw new Error(`${s.name}: lowest total ${min} has no band`);
  }
});
t('BSA bands join up (no jumps at boundaries)', () => {
  const b = F.bsa.bands;
  for (let i = 0; i < b.length - 1; i++) { const kg = b[i].upToKg; eq(kg * b[i].perKg + b[i].add, kg * b[i + 1].perKg + b[i + 1].add, `at ${kg} kg`); }
});
t('every calculator runs for a typical 3 yr, 14 kg child without throwing', () => {
  for (const tl of TOOLS.filter((x) => !x.score)) tl.run(Object.fromEntries(tl.inputs.map((i) => [i.id, i.default ?? null])), { kg: 14, months: 36 });
});

// --- worked examples from the PDF ---
t('GIR p.59: 10 kg, D10 at 40 mL/h = 6.67', () => eq(C.gir(10, 40, 10), 6.6667, 'GIR', 1e-3));
t('ANC p.92: WBC 2.1, segs 53 = 1113', () => eq(C.anc(F.anc, 2.1, 53).value, 1113, 'ANC'));
t('bicarb p.86: BE −26.8, 4.9 kg = 39.4 mEq, half 19.7', () => {
  const r = C.bicarb(F.bicarb, -26.8, 4.9); eq(r.deficit, 39.396, 'deficit'); eq(r.half, 19.698, 'half');
});
t('NICU TFI p.58: 1.129 kg, TFI 80, feeds 24 mL/day', () => {
  const r = C.nicuFluids(1.129, 80, 24); eq(r.feedsPerKg, 21.258, 'feeds', 1e-3); eq(r.ivPerKg, 58.742, 'iv', 1e-3); eq(r.mlHour, 2.763, 'rate', 1e-3);
});
t('dextrose p.57: factors match the PDF (which truncates them)', () => {
  for (const [pct, f] of [[7.5, 0.055], [10, 0.11], [12.5, 0.166], [15, 0.22], [17.5, 0.28]]) eq(C.dextroseMix(F.dextrose, pct, 1).factor, f, `D${pct}`, 0.003);
});
t('dextrose: 100 mL of D10 = 11.1 mL D50 + 88.9 mL D5', () => {
  const r = C.dextroseMix(F.dextrose, 10, 100); eq(r.d50Ml, 11.111, 'D50', 1e-3); eq(r.baseMl, 88.889, 'D5', 1e-3);
});

// --- standard formulas ---
t('Holliday–Segar: 8, 15, 30 kg', () => {
  eq(C.maintenance(F.hollidaySegar, 8).mlDay, 800, '8 kg/day'); eq(C.maintenance(F.hollidaySegar, 8).mlHour, 32, '8 kg/h');
  eq(C.maintenance(F.hollidaySegar, 15).mlDay, 1250, '15 kg/day'); eq(C.maintenance(F.hollidaySegar, 15).mlHour, 50, '15 kg/h');
  eq(C.maintenance(F.hollidaySegar, 30).mlDay, 1700, '30 kg/day'); eq(C.maintenance(F.hollidaySegar, 30).mlHour, 70, '30 kg/h');
  eq(C.maintenance(F.hollidaySegar, 10).mlDay, 1000, '10 kg/day'); eq(C.maintenance(F.hollidaySegar, 20).mlHour, 60, '20 kg/h');
});
t('dehydration fluids: age split at 2 yr', () => {
  eq(C.dehydrationFluids(F.dehydrationFluids, 10, 18, 'moderate').totalMl, 1000, '18 mo');
  eq(C.dehydrationFluids(F.dehydrationFluids, 12, 24, 'moderate').totalMl, 720, '2 yr');
  eq(C.dehydrationFluids(F.dehydrationFluids, 12, 30, 'severe').rates[0].mlHour, 180, 'rate over 6 h');
});
t('ORS: plan B and C, infant vs child timing', () => {
  const inf = C.ors(F.ors, 8, 9), ch = C.ors(F.ors, 15, 48);
  eq(inf.planB.ml, 600, 'plan B'); eq(inf.planC.first.mlHour, 240, 'infant first hour'); eq(inf.planC.second.hours, 5, 'infant second');
  eq(ch.planC.first.mlHour, 900, 'child 450 mL over 30 min'); eq(ch.planA, '100–200 mL after each loose stool', 'plan A 4 yr');
  eq(C.ors(F.ors, 8, null).planC, null, 'no age, no plan C');
});
t('BSA bands and Mosteller', () => {
  eq(C.bsaBands(F.bsa, 4), 0.25, '4 kg'); eq(C.bsaBands(F.bsa, 15), 0.65, '15 kg'); eq(C.bsaBands(F.bsa, 50), 1.3, '50 kg');
  eq(C.bsaMosteller(20, 110), 0.7817, 'Mosteller', 1e-4);
});
t('Schwartz: bedside, mg/dL and µmol/L agree', () => {
  eq(C.schwartz(F.schwartz, 0.413, 120, 0.5, 'mgdl').gfr, 99.12, 'mg/dL');
  eq(C.schwartz(F.schwartz, 0.413, 120, 44.2, 'umol').gfr, 99.12, 'µmol/L', 1e-6);
});
t('ET tube: 4 yr = 5.0 uncuffed, 4.5 cuffed, depth 14; 12 yr prefers cuffed; infant uses weight', () => {
  const r = C.etTube(F.etTube, 48, 16); eq(r.uncuffed, 5, 'size'); eq(r.cuffed, 4.5, 'cuffed'); eq(r.depthFromAge, 14, 'depth'); eq(r.depthFromSize, 15, 'size×3');
  eq(C.etTube(F.etTube, 144).preferCuffed, true, '12 yr cuffed');
  eq(C.etTube(F.etTube, 18, 11).depthFromAge, undefined, 'no age depth at 1.5 yr');
  eq(C.etTube(F.etTube, 0.5, 1.5).newbornSize, '3.0', '1.5 kg newborn');
  eq(C.etTube(F.etTube, 0.5, 3.4).newbornSize, '3.5', '3.4 kg newborn');
});
t('umbilical: 2 kg = UAC 15, UVC 8.5', () => { const r = C.umbilical(F.umbilical, 2); eq(r.uac, 15, 'UAC'); eq(r.uvc, 8.5, 'UVC'); });
t('ANC bands and I:T', () => {
  eq(C.anc(F.anc, 2, 20).band.level, 'err', '400 severe');
  eq(C.anc(F.anc, 10, 60).band.label, 'Normal', '6000 normal');
  eq(C.anc(F.anc, 10, 14).band.level, 'warn', '1400 mild');
  const r = C.anc(F.anc, 15, 40, 15, 5); eq(r.it, 1 / 3, 'I:T'); eq(r.itBand.over, 0.25, 'I:T band');
  eq(C.anc(F.anc, 15, 40).it, null, 'no immature cells, no I:T');
});

// --- scores ---
t('APGAR: all 2s = 10 good; all 1s = 5 needs support; incomplete = null', () => {
  const all = (i) => Object.fromEntries(S.apgar.items.map((it) => [it.id, i]));
  eq(C.scoreSum(S.apgar, all(2)).total, 10, 'all 2'); eq(C.scoreSum(S.apgar, all(2)).band.level, 'ok', 'band');
  eq(C.scoreSum(S.apgar, all(1)).band.level, 'warn', 'all 1'); eq(C.scoreSum(S.apgar, all(0)).band.level, 'err', 'all 0');
  eq(C.scoreSum(S.apgar, { color: 2 }), null, 'incomplete');
});
t('GCS: best = 15, worst = 3 severe', () => {
  const best = Object.fromEntries(S.gcsChild.items.map((it) => [it.id, 0]));
  const worst = Object.fromEntries(S.gcsChild.items.map((it) => [it.id, it.options.length - 1]));
  eq(C.scoreSum(S.gcsChild, best).total, 15, 'best'); eq(C.scoreSum(S.gcsInfant, worst).total, 3, 'worst');
  eq(C.scoreSum(S.gcsChild, worst).band.level, 'err', 'severe'); eq(C.scoreSum(S.gcsChild, best).max, 15, 'max');
});
t('dehydration WHO rule', () => {
  const ids = S.dehydration.items.map((it) => it.id);
  const set = (cols) => Object.fromEntries(ids.map((id, i) => [id, cols[i]]));
  eq(C.scoreColumns(S.dehydration, set([0, 0, 0, 0, 0, 0])).column.id, 'none', 'all normal');
  eq(C.scoreColumns(S.dehydration, set([1, 1, 0, 0, 0, 0])).column.id, 'some', '2 some');
  eq(C.scoreColumns(S.dehydration, set([2, 1, 0, 0, 0, 0])).column.id, 'some', '1 severe + 1 some');
  eq(C.scoreColumns(S.dehydration, set([2, 2, 0, 0, 0, 0])).column.id, 'severe', '2 severe');
  eq(C.scoreColumns(S.dehydration, set([1, 0, 0, 0, 0, 0])).column.id, 'none', '1 some only');
  eq(C.scoreColumns(S.dehydration, { condition: 1 }), null, 'incomplete');
});

const failed = results.filter((r) => r.startsWith('FAIL'));
document.getElementById('out').textContent = `${results.join('\n')}\n\n${failed.length ? `${failed.length} FAILED` : 'ALL PASSED'} (${results.length} tests)`;
document.title = failed.length ? 'FAILED' : 'ALL PASSED';
</script>
